# Cresselia — Isla Plenilunio. Juegos: Diamante Brillante y Perla Reluciente.
#
# Inicio: casa vacía de Ciudad Canal, con el mensaje del profesor Serbal (caña).
# Ruta: salir de la casa → muelle → hablar con el marinero (Sí) → viaje en barco → escaleras, bosque y claro de la
# isla → reidentificar delante de Cresselia → A final (hablarle).
# Por qué la semilla se saca en Ciudad Canal: la isla es un solo mapa y Cresselia está cargada desde el muelle; sus
# parpadeos gastan RNG a intervalos aleatorios y la semilla no sale (189 parpadeos limpios sin encajar con ningún
# npc fijo de 0 a 12). Como Regigigas: semilla en un sitio tranquilo, ruta y reidentificación delante de ella.
# Errante: se genera al hablarle (método de errantes, sin timeline) y huye sin combate.
schema_version = 1

[encounter]
id = "cresselia"         # identificador único; coincide con el nombre del fichero
version = "1.0"          # versión de esta configuración (aparece en los registros de cada intento)
game = "bdsp"
strategy = "static"      # legendario estático: se genera al interactuar con él
template = "cresselia"   # plantilla de generación con la que se busca el objetivo
games = ["BD", "SP"]     # versiones en que está: BD = Diamante Brillante, SP = Perla Reluciente
display_name = "Cresselia (Isla Plenilunio)"
display_name_en = "Cresselia (Fullmoon Island)"
status = "comprobado"    # «comprobado» (en consola real), «sin_probar» o «borrador»

# Punto de partida. Textos para el usuario: clave en español y la misma con «_en» en inglés.
[start]
name = "Casa vacía de Ciudad Canal, al norte del muelle del marinero"
name_en = "Empty house in Canalave City, north of the sailor's pier"
description = "Dentro de la casa vacía (la de la mesa baja y los cojines), sobre el borde de la alfombra, DOS casillas por encima de la puerta (una más abajo, al girarte, sales de la casa), mirando hacia la cámara, con la partida guardada ahí."
description_en = "Inside the empty house (the one with the low table and cushions), on the edge of the rug, TWO tiles above the door (one tile lower and you leave the house when you turn), facing the camera, with the game saved there."
instructions = "Carga la partida, usa la caña (sale el mensaje del profesor Serbal) y no te muevas."
instructions_en = "Load the save, use the fishing rod (Professor Rowan's message appears) and do not move."

[blink_scene]
eye_template = "bdsp/eyes/spear_pillar.png"  # ojo por defecto; se usa el que se marque en el paso «Escena»
box = [0.4828, 0.6741, 0.0365, 0.0296]       # zona del ojo dentro de la casa: [x, y, ancho, alto] normalizados
message = true           # se observa con el mensaje de Serbal en pantalla: así el personaje no gira la cabeza
min_blinks = 33          # parpadeos para identificar la semilla
confirmation_blinks = 2  # parpadeos extra para confirmarla

# Quién consume RNG mientras se observa: npc = personas del mapa, pokemon_npc = Pokémon que parpadean.
[blink_scene.scene]
npc = 0
pokemon_npc = 0

[approach]
lead_s = 330.0                   # ruta (~110 s) + reidentificar (~2-3 min) + hablarle (~18 s) + margen
after_reidentify_lead_s = 18.0   # lo que tardan los pasos de detrás de la reidentificación
# Ventana de búsqueda de la reidentificación, en avances respecto a lo previsto por el reloj de la semilla. El barco
# y la gente de Ciudad Canal desvían el contador mucho más que una ruta a pie: ventana amplia (como referencia,
# 10 000 avances ≈ 2,4 s de cálculo). Desvíos medidos: +16 860, +20 447, +22 609, +23 163.
reidentify_window = [12000, 28000]
# Adelanto del contador durante la ruta: máximo medido (+23 173) más margen. El plan de la casa apunta por debajo
# del objetivo y el resto se ajusta delante de ella.
extra_advances = 25000
front_fast_advance = true          # si aún queda lejos: Pokédex delante de Cresselia y volver a reidentificar
# Dónde ponerse para marcar el ojo de la reidentificación (se muestra en el paso «Escena»).
reidentify_eye_instructions = "Sin guardar, haz el viaje hasta Cresselia, ponte justo debajo de ella mirando hacia la cámara (un toque de cruceta abajo) y usa la caña para que salga el mensaje del profesor Serbal."
reidentify_eye_instructions_en = "Without saving, make the trip to Cresselia, stand right below her facing the camera (one tap of D-pad Down) and use the fishing rod to bring up Professor Rowan's message."
# Pasos (tipos en la clase MacroStep de games/bdsp/fast_advance.py). Los choques con árboles y paredes forman parte
# de la ruta: casi todos los tramos van «hasta chocar» para acabar siempre en la misma casilla.
steps = [
  # --- Ciudad Canal --- Por la derecha de las casas. El muelle tiene 3 filas y el marinero está en la del medio, en
  # la última columna: se llega a cualquiera de ellas y «talk_seek» se gira hacia él.
  { kind = "hold", button = "DOWN", ms = 900, wait_ms = 1500 },    # bajar 2 casillas y salir de la casa
  { kind = "hold", button = "RIGHT", ms = 2500, wait_ms = 600 },   # hasta el borde del canal
  { kind = "hold", button = "DOWN", ms = 3000, wait_ms = 600 },    # bajar junto al canal hasta el bolardo
  { kind = "hold", button = "UP", ms = 600, wait_ms = 600 },       # subir al muelle (1-2 casillas: cualquiera vale)
  { kind = "hold", button = "RIGHT", ms = 2000, wait_ms = 600 },   # al muelle, hasta el marinero
  { kind = "talk_seek", button = "RIGHT", ms = 15000 },            # A; si está encima/debajo de él, girarse y A
  { kind = "dialog_until_choice", ms = 20000 },                    # A en cada texto hasta la caja Sí/No
  { kind = "press", button = "A", ms = 80, wait_ms = 1500 },       # «Sí»
  { kind = "dialog_next", ms = 8000 },                             # «¡Confiamos en ti!…» ▼
  { kind = "dialog_settle", ms = 8000 },                           # «¡Necesito la Pluma Lunar…!» (sin ▼)
  { kind = "press", button = "A", ms = 80, wait_ms = 1500 },
  { kind = "dialog_settle", ms = 8000 },                           # «¡Levemos anclas!» (sin ▼)
  # Viaje en barco: dura 16-30 s y durante él no vale ninguna pulsación; se espera 40 s para cubrir el peor caso.
  { kind = "press", button = "A", ms = 80, wait_ms = 40000 },
  # --- Isla Plenilunio ---
  { kind = "hold", button = "UP", ms = 800, wait_ms = 600 },
  { kind = "hold", button = "LEFT", ms = 900, wait_ms = 600 },     # escaleras
  { kind = "hold", button = "UP", ms = 1500, wait_ms = 600 },
  { kind = "hold", button = "UP", ms = 1500, wait_ms = 600 },      # choca con un desnivel
  { kind = "hold", button = "RIGHT", ms = 300, wait_ms = 400 },
  { kind = "hold", button = "UP", ms = 1500, wait_ms = 600 },      # hasta el borde del acantilado
  { kind = "hold", button = "RIGHT", ms = 1500, wait_ms = 600 },
  { kind = "hold", button = "DOWN", ms = 300, wait_ms = 400 },
  { kind = "hold", button = "RIGHT", ms = 1500, wait_ms = 600 },
  { kind = "hold", button = "DOWN", ms = 300, wait_ms = 400 },
  { kind = "hold", button = "RIGHT", ms = 2000, wait_ms = 600 },
  { kind = "hold", button = "DOWN", ms = 300, wait_ms = 400 },
  { kind = "hold", button = "RIGHT", ms = 900, wait_ms = 600 },
  { kind = "hold", button = "DOWN", ms = 300, wait_ms = 400 },
  { kind = "hold", button = "RIGHT", ms = 600, wait_ms = 600 },
  { kind = "hold", button = "RIGHT", ms = 300, wait_ms = 400 },    # sobre el claro oscuro
  { kind = "hold", button = "UP", ms = 1200, wait_ms = 1500 },     # pasillo: ya se ve Cresselia
  { kind = "hold", button = "UP", ms = 1000, wait_ms = 800 },
  { kind = "hold", button = "LEFT", ms = 300, wait_ms = 500 },
  { kind = "hold", button = "UP", ms = 500, wait_ms = 600 },       # justo debajo de Cresselia
  { kind = "hold", button = "DOWN", ms = 60, wait_ms = 800 },      # girarse hacia la cámara (para ver el ojo)
  # Reidentificar: caña, mensaje de Serbal y «blinks» parpadeos con el ojo «eye» (marcado en el paso «Escena»).
  { kind = "reidentify_pokemon", eye = "cresselia_delante", blinks = 14, ms = 360000 },
  { kind = "press", button = "A", ms = 80, wait_ms = 800 },        # quitar el mensaje de Serbal
  { kind = "hold", button = "UP", ms = 60, wait_ms = 800 },        # girarse hacia ella (la A final le habla)
]

# Sin [[timeline]]: una sola pulsación (hablarle) genera el Pokémon (método de errantes).

[final]
trigger = "A"                    # pulsación que genera el Pokémon
final_delay = 109                # avances entre la pulsación final y la generación; delay inicial, se calibra solo
min_timeline_s = 0.0             # sin timeline
min_gap_margin_s = 0.12          # margen mínimo (s) a cada lado de la pulsación final

# Acciones de avance rápido permitidas en la espera (ids de src/rngauto/games/bdsp/data/fast_advance.toml).
[fast_advance]
methods = ["pokedex_peek", "pokedex_scroll"]

[verification]
observe = ["shiny", "nature", "stats"]  # qué se lee de la ficha del Pokémon obtenido
species = ["cresselia"]                 # especies posibles (estadísticas base con las que se interpreta la ficha)
capture = "user"         # no entra en combate al generarse: la captura el usuario y pulsa «Listo»

[recovery]
method = "restart_game"  # para repetir el intento: reiniciar el juego y cargar la partida
