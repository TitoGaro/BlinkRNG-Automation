# Heatran — Montaña Dura. Juegos: Diamante Brillante y Perla Reluciente.
#
# Inicio: en la sala anterior a la de Heatran (donde aún no se le ve), con el mensaje del profesor Serbal (caña).
# Ruta: caminar hasta Heatran → reidentificar delante de él (sus parpadeos gastan RNG) → hablarle → A de inicio del
# timeline → A final en su grito → combate. Mismo esquema que regigigas.toml. Pasos de la ruta pendientes de
# comprobar en consola.
schema_version = 1

[encounter]
id = "heatran"           # identificador único; coincide con el nombre del fichero
version = "0.1"          # versión de esta configuración (aparece en los registros de cada intento)
game = "bdsp"
strategy = "static"      # legendario estático: se genera al interactuar con él
template = "heatran"     # plantilla de generación con la que se busca el objetivo
games = ["BD", "SP"]     # versiones en que está: BD = Diamante Brillante, SP = Perla Reluciente
display_name = "Heatran (Montaña Dura)"
display_name_en = "Heatran (Stark Mountain)"
status = "sin_probar"    # «comprobado» (en consola real), «sin_probar» o «borrador»

# Punto de partida. Textos para el usuario: clave en español y la misma con «_en» en inglés.
[start]
name = "Montaña Dura, antes de la sala de Heatran"
name_en = "Stark Mountain, before Heatran's chamber"
description = "En la sala anterior a la de Heatran (donde aún no se le ve), mirando hacia la cámara, con la partida guardada ahí."
description_en = "In the chamber before Heatran's (where it is not yet visible), facing the camera, with the game saved there."
instructions = "Carga la partida, usa la caña (sale el mensaje del profesor Serbal) y no te muevas."
instructions_en = "Load the save, use the fishing rod (Professor Rowan's message appears) and do not move."

[blink_scene]
eye_template = "bdsp/eyes/spear_pillar.png"  # ojo por defecto; se usa el que se marque en el paso «Escena»
box = [0.4852, 0.4764, 0.0133, 0.0264]       # zona donde buscar el ojo: [x, y, ancho, alto] normalizados (0-1)
message = true           # se observa con el mensaje de Serbal en pantalla: así el personaje no gira la cabeza
min_blinks = 33          # parpadeos para identificar la semilla
confirmation_blinks = 2  # parpadeos extra para confirmarla

# Quién consume RNG mientras se observa: npc = personas del mapa, pokemon_npc = Pokémon que parpadean.
[blink_scene.scene]
npc = 0
pokemon_npc = 0          # Heatran aún no está cargado

[approach]
lead_s = 240.0                   # empieza 240 s antes del inicio: caminar + reidentificar (~2-3 min) + hablarle
after_reidentify_lead_s = 18.0   # lo que tardan los pasos de detrás de la reidentificación
# Dónde ponerse para marcar el ojo de la reidentificación (se muestra en el paso «Escena»).
reidentify_eye_instructions = "Sin guardar, ve hasta Heatran, ponte justo debajo mirando hacia la cámara (un toque de cruceta abajo) y usa la caña para que salga el mensaje del profesor Serbal."
reidentify_eye_instructions_en = "Without saving, go to Heatran, stand right below it facing the camera (one tap of D-pad Down) and use the fishing rod to bring up Professor Rowan's message."
# Pasos (tipos en la clase MacroStep de games/bdsp/fast_advance.py): «hold» mantiene la cruceta «ms» ms y espera
# «wait_ms»; «press» pulsa un botón; «dialog_settle» espera un texto quieto sin ▼ y no pulsa.
steps = [
  { kind = "hold", button = "UP", ms = 2000, wait_ms = 1000 },   # caminar hasta Heatran (pendiente de comprobar)
  { kind = "hold", button = "DOWN", ms = 60, wait_ms = 800 },    # girarse hacia la cámara (para ver el ojo)
  # Reidentificar: caña, mensaje de Serbal y «blinks» parpadeos con el ojo «eye» (marcado en el paso «Escena»).
  { kind = "reidentify_pokemon", eye = "heatran_delante", blinks = 12, ms = 300000 },
  { kind = "press", button = "A", ms = 80, wait_ms = 300 },      # quitar el mensaje de Serbal
  { kind = "hold", button = "UP", ms = 60, wait_ms = 800 },      # girarse hacia él
  { kind = "press", button = "A", ms = 80, wait_ms = 300 },      # hablarle
  { kind = "dialog_settle", ms = 6000 },                         # su primer texto (pendiente: cuántos hay)
]

# Timeline: desde la pulsación de inicio, el RNG avanza así: «blank_reads» llamadas inmediatas, una pausa sin
# consumo de «pause_s» s, «fixed_delay» llamadas fijas y después la escena de [timeline.scene].
# A de inicio: hablarle (fogonazo de 2 s); la A final, en «Gwogbogogo...», inicia el combate.
[[timeline]]
name = "diálogo con Heatran"
trigger = "A"          # pulsación que inicia el timeline
blank_reads = 2
pause_s = 2.0          # fogonazo blanco
fixed_delay = 0        # llamadas fijas tras el fogonazo

[timeline.scene]
npc = 0
pokemon_npc = 1        # Heatran parpadea

[final]
trigger = "A"          # pulsación que genera el Pokémon
final_delay = 84       # avances entre la pulsación final y la generación; delay inicial, se calibra solo
min_timeline_s = 15.0  # tiempo mínimo entre el inicio del timeline y la pulsación final
min_gap_margin_s = 0.12  # margen mínimo (s) a cada lado de la pulsación final

# Acciones de avance rápido permitidas en la espera (ids de src/rngauto/games/bdsp/data/fast_advance.toml).
[fast_advance]
methods = ["pokedex_peek", "pokedex_scroll"]

[verification]
observe = ["shiny", "nature", "stats"]  # qué se lee de la ficha del Pokémon obtenido
species = ["heatran"]                   # especies posibles (estadísticas base con las que se interpreta la ficha)

[recovery]
method = "restart_game"  # para repetir el intento: reiniciar el juego y cargar la partida
