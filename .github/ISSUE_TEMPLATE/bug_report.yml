name: Fallo / Bug report
description: Algo no funciona como debería · Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Truco:** desde la aplicación, «Créditos → Informar de un problema» (o el botón que sale en los errores) rellena casi todo esto solo.
        **Tip:** in the app, "Credits → Report a problem" (or the button shown with errors) fills in most of this for you.

  - type: textarea
    id: what
    attributes:
      label: Qué ha pasado / What happened
      description: Qué hacías, qué esperabas y qué ha ocurrido · What you were doing, what you expected and what happened
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Cómo reproducirlo / How to reproduce it
      description: En qué paso y fase estaba la aplicación; si pasa siempre o a veces · Which step and phase the app was in; whether it always happens
      placeholder: |
        1. Paso «Ejecutar», fase «Pokédex»…
        2. …

  - type: input
    id: version
    attributes:
      label: Versión / Version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: encounter
    attributes:
      label: Encuentro / Encounter
      placeholder: "cresselia (Cresselia (Isla Plenilunio))"

  - type: dropdown
    id: game
    attributes:
      label: Juego / Game
      options:
        - Diamante Brillante / Brilliant Diamond
        - Perla Reluciente / Shining Pearl

  - type: dropdown
    id: game_language
    attributes:
      label: Idioma del juego / Game language
      options:
        - Español
        - English
        - Français
        - Deutsch
        - Italiano
        - 日本語
        - 한국어
        - 中文

  - type: textarea
    id: setup
    attributes:
      label: Montaje / Setup
      description: Capturadora (modelo), placa del mando (ESP32, ESP32-S3…), Switch o Switch 2 · Capture card model, controller board, Switch or Switch 2
      placeholder: |
        Capturadora: …
        Mando: ESP32 · firmware …

  - type: textarea
    id: diagnostic
    attributes:
      label: Informe de diagnóstico / Diagnostic report
      description: Lo genera la aplicación. Si es un fallo de detección, adjunta también capturas o el vídeo del ojo de la sesión (carpeta `%USERPROFILE%\.rngauto\sessions`) · Generated by the app. For detection problems, also attach screenshots or the eye video of the session.
